name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - run: npm test
      - run: python -m pip install -e ./python pytest
      - run: python -m pytest python/tests -q
      - run: python python/tools/generate.py
      - run: git diff --exit-code -- python/src/parsianapi python/docs/reference.md
  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m build python
      - run: python -m twine check python/dist/*
