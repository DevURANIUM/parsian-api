name: Publish parsian-api to PyPI
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed package version (must match python/pyproject.toml)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pypi-publish
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm test
      - run: python -m pip install -e ./python pytest build twine
      - run: python -m pytest python/tests -q
      - name: Validate selected package version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/check-python-release.py
      - run: python -m build python
      - run: python -m twine check python/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: python/dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/parsian-api
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
